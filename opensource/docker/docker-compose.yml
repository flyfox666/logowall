services:
  logo-wall:
    build: .
    container_name: logo-wall
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-admin123}
      - DATA_DIR=/data
    volumes:
      - logo-wall-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/filters')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  logo-wall-data:
