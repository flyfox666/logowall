<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 | Logo Wall</title>
<link rel="stylesheet" href="/static/login.css">
</head>
<body>
<button class="lang-toggle" id="lang-btn" onclick="toggleLang()">EN</button>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">LW</div>
            <h1 id="login-title">客户品牌墙</h1>
            <p id="login-subtitle">请登录以继续访问</p>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="label-username" for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label id="label-password" for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn" id="login-btn">登录</button>
        </form>

        <div class="redirect-info">
            <span id="redirect-text">登录后将跳转到</span>
            <a id="redirect-link" href="/">展示页</a>
        </div>

        <div class="login-footer" id="login-footer">
            Logo Wall &copy; 2026
        </div>
    </div>
</div>

<script src="/static/login.js"></script>
</body>
</html>
